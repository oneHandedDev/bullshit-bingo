<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Business Bullshit Bingo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f1;
        --fg: #16181d;
        --muted: #5d626d;
        --cell-bg: #ffffff;
        --cell-border: #d2d5dc;
        --marked-bg: #2f6f4f;
        --marked-fg: #ffffff;
        --accent: #c4691b;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161a;
          --fg: #e8e9ec;
          --muted: #9ba1ad;
          --cell-bg: #1e2127;
          --cell-border: #33373f;
          --marked-bg: #3f8f66;
          --marked-fg: #0c0f12;
          --accent: #f0a94c;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 1rem;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        justify-content: center;
      }

      main {
        width: 100%;
        max-width: 34rem;
      }

      h1 {
        font-size: clamp(1.1rem, 5vw, 1.6rem);
        margin: 0 0 0.75rem;
      }

      .actions {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }

      .actions button {
        flex: 1;
        padding: 0.6rem 0.5rem;
        font: inherit;
        font-size: 0.9rem;
        color: inherit;
        background: var(--cell-bg);
        border: 1px solid var(--cell-border);
        border-radius: 0.5rem;
        cursor: pointer;
      }

      .actions button:hover {
        border-color: var(--accent);
      }

      .banner {
        margin: 0 0 0.75rem;
        min-height: 1.4em;
        font-weight: 700;
        color: var(--accent);
      }

      .grid {
        display: grid;
        /* The 5 here must track CARD_SIZE in bingo.js. */
        /* minmax(0, 1fr), not 1fr: a plain 1fr floors at min-content, so a long
           word in one phrase would push the grid wider than a phone screen. */
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 0.5rem;
      }

      .cell {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        padding: 0.35rem;
        font: inherit;
        font-size: clamp(0.6rem, 2.7vw, 1rem);
        line-height: 1.15;
        text-align: center;
        /* break-word, not anywhere: only split a word that cannot fit on its
           own line, so "Actionable" wraps whole instead of as "Actionabl e". */
        overflow-wrap: break-word;
        hyphens: auto;
        color: inherit;
        background: var(--cell-bg);
        border: 1px solid var(--cell-border);
        border-radius: 0.6rem;
        cursor: pointer;
      }

      .cell.marked {
        background: var(--marked-bg);
        color: var(--marked-fg);
        text-decoration: line-through;
      }

      .cell.winning {
        outline: 3px solid var(--accent);
        outline-offset: -3px;
      }

      .cell:focus-visible {
        outline: 3px solid var(--fg);
        outline-offset: 2px;
      }

      .status {
        margin: 0.75rem 0 0;
        min-height: 1.4em;
        font-size: 0.85rem;
        color: var(--muted);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Business Bullshit Bingo</h1>

      <div class="actions">
        <button id="new-card" type="button">New card</button>
        <button id="copy-result" type="button">Copy result</button>
      </div>

      <p id="banner" class="banner" aria-live="polite"></p>

      <div id="grid" class="grid" role="group" aria-label="Bingo card"></div>

      <p id="status" class="status" aria-live="polite"></p>
    </main>

    <script type="module">
      import { DECK } from './deck.js';
      import {
        CELL_COUNT,
        LINES,
        buildCard,
        findWins,
        formatShare,
        lineName,
      } from './bingo.js';

      const grid = document.getElementById('grid');
      const banner = document.getElementById('banner');
      const status = document.getElementById('status');

      let card = buildCard(DECK);
      let marked = new Array(CELL_COUNT).fill(false);

      const cells = Array.from({ length: CELL_COUNT }, (_, index) => {
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'cell';
        cell.addEventListener('click', () => {
          marked[index] = !marked[index];
          status.textContent = '';
          render();
        });
        grid.append(cell);
        return cell;
      });

      function render() {
        const wins = findWins(marked);
        const winningCells = new Set(wins.flatMap((win) => LINES[win]));

        cells.forEach((cell, index) => {
          cell.textContent = card[index];
          cell.classList.toggle('marked', marked[index]);
          cell.classList.toggle('winning', winningCells.has(index));
          cell.setAttribute('aria-pressed', String(marked[index]));
        });

        const nextBanner =
          wins.length > 0 ? `BINGO — ${wins.map(lineName).join(', ')}` : '';
        if (banner.textContent !== nextBanner) {
          banner.textContent = nextBanner;
        }
      }

      document.getElementById('new-card').addEventListener('click', () => {
        const inProgress = marked.some(Boolean);
        if (inProgress && !confirm('Start a new card? Current marks are lost.')) {
          return;
        }
        card = buildCard(DECK);
        marked = new Array(CELL_COUNT).fill(false);
        status.textContent = '';
        render();
      });

      document.getElementById('copy-result').addEventListener('click', async () => {
        const text = formatShare(marked, findWins(marked));
        try {
          await navigator.clipboard.writeText(text);
          status.textContent = 'Copied to clipboard.';
        } catch {
          status.textContent = `Copy failed — select and copy this:\n${text}`;
        }
      });

      render();
    </script>
  </body>
</html>
